<head>
  <meta charset="UTF-8" />

<body>
  <header class="primary-header">
    <div class="container">
      <div class="primary-header-wrapper">
        <div class="mark">Generator</div>
      </div>
      <h1 class="fs-primary-heading">Starkes Passwort für Ihr System</h1>

    </div>
  </header>
  <div class="container padding-block-400">
       <label for="length-select">Choose a length:</label>

<select name="length" id="length-select">
  <option value="">--Bitte-auswählen----</option>
  <option value="8">acht</option>
  <option value="9">neun</option>
  <option value="10">zehn</option>
  <option value="11">elf</option>
  <option value="12">zwölf</option>
  <option value="16">sechzehn</option>

</select>
 <button generate class="button">generieren</button>
    <div class="pwcanvas">
      <div class="pwcell">
        <div class="pwchar is-major">T</div>
        <div class="pwseq">1.</div>
      </div>
      <div class="pwcell">
        <div class="pwchar">p</div>
        <div class="pwseq">2.</div>
      </div>
      <div class="pwcell">
        <div class="pwchar">a</div>
        <div class="pwseq">3.</div>
      </div>
      <div class="pwcell">
        <div class="pwchar">r</div>
        <div class="pwseq">4.</div>
      </div>
      <div class="pwcell">
        <div class="pwchar is-number">2</div>
        <div class="pwseq">5.</div>
      </div>
      <div class="pwcell">
        <div class="pwchar">x</div>
        <div class="pwseq">6.</div>
      </div>
      <div class="pwcell">
        <div class="pwchar is-number">1</div>
        <div class="pwseq">7.</div>
      </div>
      <div class="pwcell">
        <div class="pwchar is-number">7</div>
        <div class="pwseq">8.</div>
      </div>
      <div class="pwcell">
        <div class="pwchar is-special">&amp</div>
        <div class="pwseq">9.</div>
      </div>
    </div>
  </div>
